[project]
name = "mindyard"
dynamic = ["version"]
description = "Your personal LLM wiki: a git-versioned Markdown vault served over MCP"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Florian Triclin" }]
requires-python = ">=3.12"
dependencies = [
    # <3.5: mindyard.auth.consent relies on OAuthProxy internals; its test guards upgrades.
    "fastmcp>=3.4.11,<3.5",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
mindyard = "mindyard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mindyard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mindyard"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:The httpx module is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src/mindyard"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
